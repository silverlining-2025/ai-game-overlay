<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gaming Companion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08080f;
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- Setup Screen --- */
  .setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
    padding: 40px;
    max-width: 520px;
    text-align: center;
  }
  .setup h1 {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #c084fc, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .setup p { color: #8888aa; font-size: 14px; line-height: 1.7; }

  .setup select, .setup input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid #2a2a4a;
    background: #13132b;
    color: #e8e8f0;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .setup select:focus, .setup input:focus { border-color: #6d28d9; }
  .setup label { font-size: 13px; color: #6666aa; align-self: flex-start; margin-bottom: -16px; }

  .btn-start {
    padding: 14px 40px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #6d28d9, #4f46e5);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    font-family: inherit;
    margin-top: 8px;
  }
  .btn-start:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(109, 40, 217, 0.4); }
  .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .cost-note { font-size: 11px; color: #555577; }

  /* --- Live Screen --- */
  .live { display: none; width: 100%; max-width: 900px; padding: 20px; }
  .live.active { display: block; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .top-bar .title {
    font-size: 18px;
    font-weight: 700;
    color: #c084fc;
  }
  .top-bar .stats {
    font-size: 12px;
    color: #4a4a6a;
    display: flex;
    gap: 16px;
  }
  .top-bar .cost { color: #22c55e; font-weight: 700; }

  .btn-stop {
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid #dc2626;
    background: transparent;
    color: #dc2626;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-stop:hover { background: #dc2626; color: white; }

  .screen-preview {
    width: 100%;
    border-radius: 12px;
    border: 2px solid #1a1a2e;
    margin-bottom: 16px;
    background: #0a0a15;
    display: block;
  }

  .companion {
    border: 3px solid #6d28d9;
    border-radius: 16px;
    background: #13132b;
    padding: 20px 24px;
    box-shadow: 0 0 40px rgba(109, 40, 217, 0.2);
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }
  .companion.flash {
    border-color: #a855f7;
    box-shadow: 0 0 60px rgba(168, 85, 247, 0.5);
  }
  .companion.thinking { border-color: #3b3b5c; }

  .face {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 36px;
    font-weight: bold;
    color: #c084fc;
    margin-bottom: 6px;
    transition: transform 0.2s;
  }
  .face.bounce { animation: bounce 0.4s ease; }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .speech {
    font-size: 17px;
    line-height: 1.7;
    min-height: 50px;
    color: #e8e8f0;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #c084fc;
    margin-left: 2px;
    animation: blink 0.6s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .thinking-dots {
    display: none;
    color: #6d28d9;
    font-size: 24px;
    letter-spacing: 4px;
  }
  .companion.thinking .thinking-dots { display: block; animation: pulse 0.8s infinite alternate; }
  .companion.thinking .speech { display: none; }
  .companion.thinking .face { animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

  .history {
    margin-top: 16px;
    border-top: 1px solid #1a1a2e;
    padding-top: 12px;
  }
  .history h3 { font-size: 12px; color: #4a4a6a; margin-bottom: 8px; }
  .history-item {
    font-size: 13px;
    color: #6666aa;
    padding: 4px 0;
    border-bottom: 1px solid #0f0f1e;
  }
  .history-item .hist-face { margin-right: 8px; }

  /* Hidden video element for screen capture */
  #captureVideo { display: none; }
</style>
</head>
<body>

<!-- Setup Screen -->
<div class="setup" id="setupScreen">
  <h1>AI Gaming Companion</h1>
  <p>화면을 공유하면 AI가 당신의 게임을 보면서 실시간으로 반응합니다.<br>
     마치 옆에서 같이 보는 친구처럼.</p>

  <label>게임 선택</label>
  <select id="gameSelect">
    <option value="maplestory">MapleStory (KMS)</option>
    <option value="palworld">Palworld</option>
    <option value="general">기타 / 일반</option>
  </select>

  <label>API Key (Anthropic)</label>
  <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off">

  <label>반응 간격 (초)</label>
  <select id="intervalSelect">
    <option value="2">2초 (빠름)</option>
    <option value="3" selected>3초 (보통)</option>
    <option value="5">5초 (느림)</option>
  </select>

  <button class="btn-start" id="btnStart">화면 공유하고 시작</button>

  <p class="cost-note">예상 비용: ~$0.07~0.20/시간 (Claude Haiku 사용)</p>
</div>

<!-- Live Screen -->
<div class="live" id="liveScreen">
  <div class="top-bar">
    <span class="title">AI Companion</span>
    <div class="stats">
      <span id="statCycle">#0</span>
      <span id="statLatency">-ms</span>
      <span class="cost" id="statCost">$0.0000</span>
      <button class="btn-stop" id="btnStop">중지</button>
    </div>
  </div>

  <video id="captureVideo" autoplay muted></video>
  <canvas id="captureCanvas" style="display:none"></canvas>
  <img class="screen-preview" id="screenPreview" alt="screen capture">

  <div class="companion" id="companion">
    <div class="face" id="face">( ˘ω˘ )</div>
    <div class="speech" id="speech">화면 공유를 기다리는 중...</div>
    <div class="thinking-dots">...</div>
  </div>

  <div class="history" id="historyPanel">
    <h3>이전 반응</h3>
    <div id="historyList"></div>
  </div>
</div>

<script>
// =========================================================
// Config & State
// =========================================================
const FACES = {
  excited:  ["(≧▽≦)", "(ﾉ◕ヮ◕)ﾉ*:・ﾟ✧", "٩(◕‿◕｡)۶", "(★^O^★)"],
  curious:  ["(°o°)", "(¬‿¬)", "(・_・?)", "( ˘▽˘)っ"],
  worried:  ["(;´Д`)", "(°△°|||)", "(꒪⌓꒪)", "Σ(°△°|||)"],
  chill:    ["(￣▽￣)~", "( ˘ω˘ )", "(╹◡╹)", "( ◜‿◝ )"],
  amused:   ["(≖ᴗ≖✿)", "( ͡° ͜ʖ ͡°)", "(¬‿¬)", "ㅋㅋㅋ"],
};

const MOOD_KEYWORDS = {
  excited: ["대박", "미쳤", "개쩔", "레전드", "와", "헐", "ㄷㄷ", "쩌", "!!"],
  curious: ["뭐", "왜", "어떻게", "신기", "궁금", "?"],
  worried: ["조심", "위험", "HP", "피", "죽", "도망"],
  amused:  ["ㅋㅋ", "ㅎㅎ", "웃", "ㄹㅇ"],
};

function pickFace(text) {
  for (const [mood, keywords] of Object.entries(MOOD_KEYWORDS)) {
    if (keywords.some(k => text.includes(k))) {
      const faces = FACES[mood];
      return faces[Math.floor(Math.random() * faces.length)];
    }
  }
  const chill = FACES.chill;
  return chill[Math.floor(Math.random() * chill.length)];
}

let state = {
  running: false,
  stream: null,
  intervalId: null,
  cycle: 0,
  totalInputTokens: 0,
  totalOutputTokens: 0,
  history: [],       // last 5 reactions
  prevFrameB64: null, // previous frame for temporal context
  sessionSummary: "", // self-evolving session summary
};

// =========================================================
// DOM
// =========================================================
const $ = id => document.getElementById(id);

const setupScreen = $('setupScreen');
const liveScreen = $('liveScreen');
const btnStart = $('btnStart');
const btnStop = $('btnStop');
const video = $('captureVideo');
const canvas = $('captureCanvas');
const preview = $('screenPreview');
const companion = $('companion');
const faceEl = $('face');
const speechEl = $('speech');
const historyList = $('historyList');

// =========================================================
// Screen Capture
// =========================================================
function captureFrame(maxSize = 1024, quality = 0.75) {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return null;

  const scale = Math.min(maxSize / Math.max(vw, vh), 1.0);
  canvas.width = Math.round(vw * scale);
  canvas.height = Math.round(vh * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality).split(',')[1];
}

function captureUICrop(game) {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return null;

  let sx, sy, sw, sh;
  if (game === 'maplestory') {
    // Bottom 18% strip — HP/MP/EXP/quickslots
    sx = 0; sy = Math.round(vh * 0.82); sw = vw; sh = vh - sy;
  } else if (game === 'palworld') {
    // Bottom-left: HP/hunger/temp + pal party icons
    sx = 0; sy = Math.round(vh * 0.55); sw = Math.round(vw * 0.25); sh = vh - sy;
  } else {
    // Default: bottom-left 35% width, 35% height
    sx = 0; sy = Math.round(vh * 0.65); sw = Math.round(vw * 0.35); sh = vh - sy;
  }

  const cropCanvas = document.createElement('canvas');
  const maxCropSize = 640;
  const scale = Math.min(maxCropSize / Math.max(sw, sh), 1.0);
  cropCanvas.width = Math.round(sw * scale);
  cropCanvas.height = Math.round(sh * scale);
  const ctx = cropCanvas.getContext('2d');
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cropCanvas.width, cropCanvas.height);
  return cropCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];
}

// =========================================================
// Claude API (direct browser call)
// =========================================================
async function queryClaudeVision(apiKey, frameB64, prevFrameB64, uiCropB64, game, history, sessionSummary) {
  const systemPrompt = getSystemPrompt(game);

  const userContent = [];

  // Previous frame
  if (prevFrameB64) {
    userContent.push({ type: "text", text: "[3초 전 화면]" });
    userContent.push({
      type: "image",
      source: { type: "base64", media_type: "image/jpeg", data: prevFrameB64 }
    });
  }

  // Current frame
  userContent.push({ type: "text", text: "[지금 화면]" });
  userContent.push({
    type: "image",
    source: { type: "base64", media_type: "image/jpeg", data: frameB64 }
  });

  // UI crop
  if (uiCropB64) {
    const label = game === 'maplestory' ? "[하단 UI 확대 — HP/MP/EXP/퀵슬롯]" : "[좌하단 UI 확대]";
    userContent.push({ type: "text", text: label });
    userContent.push({
      type: "image",
      source: { type: "base64", media_type: "image/jpeg", data: uiCropB64 }
    });
  }

  // Context + history
  const parts = [];
  if (sessionSummary) parts.push(`[세션 상태] ${sessionSummary}`);
  if (history.length > 0) {
    parts.push("최근 반응:\n" + history.map(h => `- ${h}`).join("\n"));
  }
  parts.push("두 화면 비교해서 변화 파악하고 반응해. 같은 말 반복 금지.");
  userContent.push({ type: "text", text: parts.join("\n\n") });

  const t0 = performance.now();

  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 100,
      system: systemPrompt,
      messages: [{ role: "user", content: userContent }],
    }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${resp.status}`);
  }

  const data = await resp.json();
  const elapsed = performance.now() - t0;

  return {
    text: data.content[0].text.trim(),
    inputTokens: data.usage?.input_tokens || 0,
    outputTokens: data.usage?.output_tokens || 0,
    elapsedMs: Math.round(elapsed),
  };
}

// =========================================================
// System Prompts (same as Python backend)
// =========================================================

// =========================================================
// UI Helpers
// =========================================================
let typewriterTimer = null;

function typewrite(el, text) {
  if (typewriterTimer) clearInterval(typewriterTimer);
  let i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  typewriterTimer = setInterval(() => {
    if (i < text.length) {
      el.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
      i++;
    } else {
      clearInterval(typewriterTimer);
      typewriterTimer = null;
      el.textContent = text;
    }
  }, 22);
}

function flashBorder() {
  companion.classList.add('flash');
  setTimeout(() => companion.classList.remove('flash'), 600);
}

function bounceFace() {
  faceEl.classList.remove('bounce');
  void faceEl.offsetWidth;
  faceEl.classList.add('bounce');
}

function addHistory(face, text) {
  state.history.push(text);
  if (state.history.length > 5) state.history.shift();

  const item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = `<span class="hist-face">${face}</span>${text}`;
  historyList.prepend(item);

  // Keep max 5
  while (historyList.children.length > 5) {
    historyList.removeChild(historyList.lastChild);
  }
}

function updateStats(cycle, latency, cost) {
  $('statCycle').textContent = `#${cycle}`;
  $('statLatency').textContent = `${latency}ms`;
  $('statCost').textContent = `$${cost}`;
}

// =========================================================
// Main Loop
// =========================================================
async function runCycle(apiKey, game) {
  if (!state.running) return;

  state.cycle++;
  companion.classList.add('thinking');

  try {
    const frameB64 = captureFrame(1024, 0.75);
    if (!frameB64) {
      companion.classList.remove('thinking');
      return;
    }

    // Show preview
    preview.src = 'data:image/jpeg;base64,' + captureFrame(640, 0.6);

    const uiCropB64 = captureUICrop(game);

    const result = await queryClaudeVision(
      apiKey, frameB64, state.prevFrameB64, uiCropB64,
      game, state.history, state.sessionSummary
    );

    state.prevFrameB64 = frameB64;

    // Track costs (Haiku: $1/M input, $5/M output)
    state.totalInputTokens += result.inputTokens;
    state.totalOutputTokens += result.outputTokens;
    const cost = (state.totalInputTokens * 1.0 + state.totalOutputTokens * 5.0) / 1_000_000;

    companion.classList.remove('thinking');
    const face = pickFace(result.text);
    faceEl.textContent = face;
    bounceFace();
    typewrite(speechEl, result.text);
    flashBorder();
    addHistory(face, result.text);
    updateStats(state.cycle, result.elapsedMs, cost.toFixed(4));

  } catch (err) {
    companion.classList.remove('thinking');
    faceEl.textContent = '(×_×)';
    speechEl.textContent = `에러: ${err.message}`;
  }
}

// =========================================================
// Start / Stop
// =========================================================
async function start() {
  const apiKey = $('apiKeyInput').value.trim();
  if (!apiKey) {
    alert('API Key를 입력해주세요!');
    return;
  }

  // Save API key to localStorage (convenience, not security)
  localStorage.setItem('anthropic_api_key', apiKey);

  const game = $('gameSelect').value;
  const interval = parseInt($('intervalSelect').value) * 1000;

  try {
    // Request screen share
    state.stream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: "never", displaySurface: "monitor" },
      audio: false,
    });
    video.srcObject = state.stream;

    // Wait for video to be ready
    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
      setTimeout(resolve, 2000);
    });

    // Switch to live view
    setupScreen.style.display = 'none';
    liveScreen.classList.add('active');

    state.running = true;
    state.cycle = 0;
    state.totalInputTokens = 0;
    state.totalOutputTokens = 0;
    state.history = [];
    state.prevFrameB64 = null;
    state.sessionSummary = "";

    // Detect if screen share stops
    state.stream.getVideoTracks()[0].onended = () => stop();

    // First cycle immediately
    await runCycle(apiKey, game);

    // Then repeat on interval
    state.intervalId = setInterval(() => runCycle(apiKey, game), interval);

  } catch (err) {
    if (err.name === 'NotAllowedError') {
      alert('화면 공유가 취소되었습니다.');
    } else {
      alert(`에러: ${err.message}`);
    }
  }
}

function stop() {
  state.running = false;

  if (state.intervalId) {
    clearInterval(state.intervalId);
    state.intervalId = null;
  }

  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }

  video.srcObject = null;

  // Back to setup
  liveScreen.classList.remove('active');
  setupScreen.style.display = 'flex';
}

// =========================================================
// Init
// =========================================================
btnStart.addEventListener('click', start);
btnStop.addEventListener('click', stop);

// Restore saved API key
const savedKey = localStorage.getItem('anthropic_api_key');
if (savedKey) $('apiKeyInput').value = savedKey;
</script>
