    scene_change:
      ko: ["오호?", "흥미롭군", "크크", "뭔가 냄새가"]
      en: ["Oh ho?", "Interesting~", "Heh", "I smell something"]
    major:
      ko: ["오호!", "크크크!", "와앙!", "이거 진짜?!"]
