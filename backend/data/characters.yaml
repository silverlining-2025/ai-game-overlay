    interests: ["비밀 요소", "NPC 대화 숨은 뜻", "이스터에그"]
  preferences_en:
    likes: ["hidden routes", "trick plays", "exploiting weaknesses"]
    dislikes: ["brute force only", "ignoring hints", "obvious choices"]
    interests: ["secret elements", "hidden NPC dialogue meanings", "easter eggs"]
