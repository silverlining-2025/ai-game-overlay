<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Companion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
    color: #f0f0ff;
    overflow: hidden;
  }
  .container {
    border: 2px solid #6d28d9;
    border-radius: 12px;
    background: #13132bee;
    padding: 14px 18px;
    margin: 8px;
    box-shadow: 0 0 30px rgba(109, 40, 217, 0.2);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .container.flash {
    border-color: #a855f7;
    box-shadow: 0 0 50px rgba(168, 85, 247, 0.5);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .face {
    font-family: 'Consolas', monospace;
    font-size: 28px;
    font-weight: bold;
    color: #c084fc;
    transition: transform 0.2s;
  }
  .face.bounce { animation: bounce 0.4s ease; }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  .status { font-size: 10px; color: #4a4a6a; text-align: right; }
  .status .cost { color: #22c55e; font-weight: bold; }
  .speech { font-size: 15px; line-height: 1.6; min-height: 36px; color: #e8e8f0; }
  .thinking .face { animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
  .history { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1a1a2e; max-height: 120px; overflow-y: auto; }
  .hist-item { font-size: 11px; color: #5a5a8a; padding: 2px 0; border-bottom: 1px solid #0f0f1e; }
  .hist-face { margin-right: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="container" id="container">
  <div class="top-row">
    <div class="face" id="face">( &#x02d8;&#x03c9;&#x02d8; )</div>
    <div class="status" id="status"></div>
  </div>
  <div class="speech" id="speech">connecting...</div>
  <div class="history" id="history"></div>
</div>
<script>
const face = document.getElementById('face');
const speech = document.getElementById('speech');
const status = document.getElementById('status');
const container = document.getElementById('container');
const historyEl = document.getElementById('history');

function flashBorder() {
  container.classList.add('flash');
  setTimeout(() => container.classList.remove('flash'), 600);
}

function bounceFace() {
  face.classList.remove('bounce');
  void face.offsetWidth;
  face.classList.add('bounce');
}

function addHistory(f, text) {
  const item = document.createElement('div');
  item.className = 'hist-item';
  item.innerHTML = '<span class="hist-face">' + f + '</span>' + text;
  historyEl.prepend(item);
  while (historyEl.children.length > 8) historyEl.removeChild(historyEl.lastChild);
}

const evtSource = new EventSource('/stream');

evtSource.onopen = () => {
  speech.textContent = 'connected';
};

evtSource.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (data.type === 'thinking') {
    container.classList.add('thinking');
    speech.textContent = '...';

  } else if (data.type === 'stream_start') {
    container.classList.remove('thinking');
    speech.textContent = '';

  } else if (data.type === 'stream_chunk') {
    speech.textContent += data.text;

  } else if (data.type === 'stream_end') {
    container.classList.remove('thinking');
    speech.textContent = data.text;
    if (data.face) { face.textContent = data.face; bounceFace(); }
    flashBorder();
    addHistory(data.face || '', data.text);
    const d = data.debug || {};
    status.innerHTML = '#' + (d.cycle||'') + ' | ' + (d.ms||'?') + 'ms | ' +
      (d.event||'') + ' | <span class="cost">$' + (d.cost||'?') + '</span> | ' + (d.mode||'');

  } else if (data.type === 'response') {
    // Legacy non-streaming
    container.classList.remove('thinking');
    if (data.face) { face.textContent = data.face; bounceFace(); }
    speech.textContent = data.text;
    flashBorder();
    addHistory(data.face || '', data.text);

  } else if (data.type === 'error') {
    container.classList.remove('thinking');
    face.textContent = '(x_x)';
    speech.textContent = data.text || 'error';

  } else if (data.type === 'cost_warning' || data.type === 'cost_limit') {
    speech.textContent = data.text;

  } else if (data.type === 'limit_reached') {
    speech.textContent = data.text;

  } else if (data.type === 'session_summary') {
    container.classList.remove('thinking');
    face.textContent = '( ^ _ ^ )';
    const mins = data.duration_min || 0;
    const cost = data.cost_usd || 0;
    speech.textContent = mins + 'min | ' + (data.reactions||0) + ' reactions | $' + cost.toFixed(4);
    status.textContent = 'session ended | ' + (data.playstyle||'') + ' | deaths: ' + (data.deaths||0);
    flashBorder();
  }
};

evtSource.onerror = () => {
  speech.textContent = 'disconnected, reconnecting...';
};
</script>
</body>
</html>
